    <style>

        opacity: 0; filter: blur(0) grayscale(0); margin-top: auto; margin-bottom: auto;

      canvas.paused { animation-name: blur; animation-duration: 0.5s; filter: blur(2px) grayscale(1); }
      canvas.unpaused { animation-name: none; }
      canvas.animatedSizeTransitions { transition: width 0.3s ease, height 0.3s ease; }

      @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes blur { 0% { filter: blur(0) grayscale(0); } 100% { filter: blur(2px) grayscale(1); } }

      .spinner {
        height: 30px; width: 30px;
        -webkit-animation: rotation 0.8s linear infinite; -moz-animation: rotation 0.8s linear infinite;
        -o-animation: rotation 0.8s linear infinite; animation: rotation 0.8s linear infinite;
        border: 5px solid #bdff00; border-top: 5px solid #719900; border-radius: 100%;
      }

      .floating-control {
        position: absolute; display: none; border: none;

      #messages { margin-left: 50px; color: white; font-family: "Lucida Console", Monaco, monospace; outline: none; border: none; padding: 0; }

    <script>
      const blob = new Blob([document.querySelector('#tick-worker').textContent]);
      const worker = new Worker(window.URL.createObjectURL(blob));
      worker.onmessage = function () { GM_tick(performance.now()); }
      const isMultiplayer = function () { return typeof GM_is_multiplayer === 'function' && GM_is_multiplayer() !== 0; }
      document.addEventListener('visibilitychange', function () {
        if (!isMultiplayer()) return;
        if (document.visibilityState === 'hidden') { worker.postMessage({run: true, fps: 60}); } 
        else { worker.postMessage({run: false}); }
      });
    </script>
